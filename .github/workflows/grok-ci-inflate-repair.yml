name: grok-ci-inflate-repair
on:
  workflow_dispatch:
  push:
    paths:
      - "ci-repair/**"
      - ".github/workflows/grok-ci-inflate-repair.yml"
permissions:
  contents: write
concurrency:
  group: grok-ci-inflate-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inflate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inflate z64 payloads
        run: |
          python3 <<'PY'
          import zlib, base64
          from pathlib import Path
          mapping = {
            "ci-repair/question.recovery.test.ts.z64": (
              "src/gateway/server-methods/question.recovery.test.ts", {671: "w"}),
            "ci-repair/proxy-server.ts.z64": (
              "src/secrets/egress-proxy/proxy-server.ts", {}),
            "ci-repair/bash-tools.exec-run.ts.z64": (
              "src/agents/bash-tools.exec-run.ts", {890: "C", 893: "S"}),
            "ci-repair/bash-tools.exec-run-secret-hooks.ts.z64": (
              "src/agents/bash-tools.exec-run-secret-hooks.ts", {}),
            "ci-repair/bash-tools.exec-secret-authority.test.ts.z64": (
              "src/agents/bash-tools.exec-secret-authority.test.ts", {}),
            "ci-repair/telegram-question-gateway.test.ts.z64": (
              "test/telegram-question-gateway.test.ts", {}),
          }
          missing = [s for s in mapping if not Path(s).exists()]
          if missing:
            print("waiting", missing)
            raise SystemExit(0)
          for src, (dest, fixes) in mapping.items():
            raw = Path(src).read_text().strip()
            try:
              data = zlib.decompress(base64.b64decode(raw))
            except zlib.error:
              s = list(raw)
              for i, ch in fixes.items():
                s[i] = ch
              data = zlib.decompress(base64.b64decode("".join(s)))
            Path(dest).write_bytes(data)
            print("restored", dest, Path(dest).stat().st_size)
          PY
      - name: Commit restored sources and cleanup
        run: |
          set -e
          if [ ! -f ci-repair/telegram-question-gateway.test.ts.z64 ]; then echo incomplete; exit 0; fi
          git config user.name "Grok Bot"
          git config user.email "130045959+ChrisCantwell@users.noreply.github.com"
          rm -rf ci-repair
          rm -f .github/workflows/grok-ci-inflate-repair.yml
          git add -A
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "$(cat <<'EOF'
          fix(ci): mirror backend CI repair onto UI stack head

          Authored by Grok Bot (xAI Grok).
          EOF
          )"
          git push
