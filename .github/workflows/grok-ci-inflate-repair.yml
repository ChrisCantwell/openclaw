name: grok-ci-inflate-repair
on:
  push:
    paths:
      - "ci-repair/**"
permissions:
  contents: write
concurrency:
  group: grok-ci-inflate-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inflate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Inflate hex payloads
        run: python3 ci-repair/inflate.py
      - name: Commit restored sources and cleanup
        run: |
          set -e
          if [ ! -f ci-repair/exec.0.hex ]; then echo incomplete; exit 0; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("ci-repair/manifest.json").read_text())
          for item in m:
            last = Path(f"ci-repair/{item['key']}.{item['nparts']-1}.hex")
            if not last.exists():
              raise SystemExit(f"incomplete {last}")
          PY
          git config user.name "Grok Bot"
          git config user.email "130045959+ChrisCantwell@users.noreply.github.com"
          rm -rf ci-repair
          rm -f .github/workflows/grok-ci-inflate-repair.yml
          git add -A
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "$(cat <<'EOF'
          fix(ci): inflate exec-run/proxy/recovery CI repair payloads

          Authored by Grok Bot (xAI Grok).
          EOF
          )"
          git push
